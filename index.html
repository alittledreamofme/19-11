<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#081126">
<title>For the Kings of Our Class ✨ | 19.11</title>
<style>
@import url('https://googleapis.com');
:root{
 --night:#081126;--plum:#10254d;--rose:#38bdf8;--pink:#7dd3fc;--gold:#ffe094;
 --cream:#f8fbff;--muted:#c7dcf5;--glass:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--cream);font-family:'DM Sans',system-ui,sans-serif;background:
 radial-gradient(ellipse at 15% 12%,#1b437a 0,transparent 34%),
 radial-gradient(ellipse at 85% 35%,#173263 0,transparent 36%),
 radial-gradient(ellipse at 50% 100%,#132952 0,transparent 44%),var(--night);
 min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.14;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://w3.org id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
#sky,#petals,#sparkles,#trail{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#sky{z-index:0}#petals{z-index:5}#sparkles{z-index:6}#trail{z-index:8}
.star{position:absolute;color:#ffe6a3;text-shadow:0 0 12px #7dd3fc;animation:twinkle var(--dur) ease-in-out infinite;opacity:.3}
@keyframes twinkle{0%,100%{transform:scale(.55) rotate(0);opacity:.22}50%{transform:scale(1.25) rotate(25deg);opacity:1}}
.orb{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:radial-gradient(circle at 35% 30%,#bae6fd99,#38bdf814 60%,transparent 72%);filter:blur(1px);animation:floatOrb var(--dur) ease-in-out infinite alternate}
@keyframes floatOrb{to{transform:translate(var(--dx),var(--dy)) scale(1.2)}}
main{position:relative;z-index:1;width:min(1100px,92vw);margin:auto;padding:22px 0 65px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0 22px;color:#cbe2fc;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand-icon{display:grid;place-items:center;width:35px;height:35px;border:1px solid #7dd3fc;border-radius:12px;background:#ffffff10;font-size:1.2rem;box-shadow:0 0 24px #38bdf833}
.nav-tag{border:1px solid #ffffff28;border-radius:99px;padding:8px 12px;background:#ffffff09;letter-spacing:.08em}
.hero{text-align:center;padding:clamp(35px,7vw,85px) 0 55px;position:relative}
.kicker{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid #7dd3fc60;background:#ffffff0b;border-radius:999px;color:#d6ecff;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 0 35px #38bdf818}
.pulse{width:7px;height:7px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 0 #38bdf888;animation:pulse 1.7s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px #38bdf800}}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(3rem,10vw,7.8rem);line-height:.97;letter-spacing:-.055em;margin:28px 0 18px;font-weight:700}
h1 .line1{display:block;color:#f4f9ff;text-shadow:0 5px 40px #38bdf833}
h1 .line2{display:block;background:linear-gradient(100deg,#60a5fa 5%,#fde68a 48%,#7dd3fc 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 22px #38bdf82b)}
.hero-sub{max-width:680px;margin:0 auto;color:#d6e6fa;font-size:clamp(1rem,2.5vw,1.18rem);line-height:1.9}
.hero-flower{font-size:clamp(3.7rem,10vw,6rem);margin:30px 0 20px;filter:drop-shadow(0 0 30px #38bdf866);animation:bouquet 4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bouquet{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-10px)}}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:28px 0 0}
.btn{position:relative;overflow:hidden;border:1px solid #ffffff28;border-radius:999px;padding:14px 22px;color:white;background:#ffffff0b;transition:transform .25s,box-shadow .25s,border-color .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px #38bdf824;border-color:#7dd3fc}
.btn.primary{color:#0b1730;font-weight:700;border:0;background:linear-gradient(115deg,#fde68a,#7dd3fc 55%,#bae6fd);box-shadow:0 8px 30px #38bdf830}
.btn.primary:after{content:"";position:absolute;top:-50%;left:-35%;width:20%;height:200%;background:#ffffff99;transform:rotate(22deg);transition:left .65s}
.btn.primary:hover:after{left:125%}
.btn .ico{margin-right:7px}
.scroll-hint{margin-top:35px;color:#9fc2e8;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;animation:hint 2s ease-in-out infinite}
@keyframes hint{50%{transform:translateY(5px);opacity:.55}}
.section{margin:26px 0;padding:clamp(24px,5vw,52px);border-radius:30px;border:1px solid #ffffff1e;background:linear-gradient(135deg,#ffffff10,#ffffff04);box-shadow:0 25px 80px #04091740;backdrop-filter:blur(14px);position:relative;overflow:hidden}
.section:before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:linear-gradient(transparent,#38bdf8,#fde68a,transparent);opacity:.85}
.section-head{text-align:center;margin-bottom:28px}
.eyebrow{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:#7dd3fc}
h2{font:600 clamp(1.8rem,5vw,3.1rem)/1.15 'Playfair Display',Georgia,serif;margin:12px 0;color:#f0f7ff}
.lead{color:#c4daf5;line-height:1.8;max-width:650px;margin:0 auto}
.letterbox{border:1px solid #7dd3fc24;background:#0d1b38aa;border-radius:22px;padding:clamp(22px,4vw,40px);line-height:2;font-size:1.04rem;color:#e6f1ff;position:relative;white-space:pre-line}
.letterbox:before,.letterbox:after{position:absolute;color:#7dd3fc;font:3rem Georgia;opacity:.7}
.letterbox:before{content:'“';left:14px;top:0}.letterbox:after{content:'”';right:14px;bottom:-17px}
.letterbox strong{color:#fde68a}
.signature{text-align:right;color:#bae6fd;font-family:'Playfair Display',Georgia,serif;font-size:1.25rem;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px;margin-top:28px}
.gift{min-height:160px;border:1px solid #ffffff19;border-radius:20px;padding:21px 14px;text-align:center;background:linear-gradient(150deg,#ffffff0d,#38bdf80a);transition:transform .25s,border-color .25s,background .25s;position:relative;overflow:hidden}
.gift:hover{transform:translateY(-7px) rotate(-1deg);border-color:#7dd3fca0;background:#38bdf817}
.gift .emoji{display:block;font-size:2.2rem;margin-bottom:12px;filter:drop-shadow(0 0 13px #38bdf833)}
.gift b{display:block;color:#f0f8ff;margin-bottom:7px}
.gift small{color:#bad4f2;line-height:1.6;display:block}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.moment{border-top:1px solid #7dd3fc4d;padding:20px 14px 0;text-align:center}
.moment .num{font:700 2rem 'Playfair Display',Georgia,serif;color:#fde68a}
.moment h3{margin:8px 0;color:#e6f3ff}
.moment p{margin:0;color:#b8d2f0;font-size:.9rem;line-height:1.7}
.wishbox{text-align:center;padding:12px}
.wish-display{min-height:95px;display:grid;place-items:center;font:500 clamp(1.35rem,4vw,2.2rem)/1.4 'Playfair Display',Georgia,serif;color:#e8f4ff;margin:25px 0}
.wish-display span{animation:appear .5s ease both}
@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.footer{text-align:center;padding:38px 10px 10px;color:#9ebce0;font-size:.82rem;line-height:1.9}
.footer .big-heart{font-size:1.7rem;display:block;margin-bottom:8px;animation:heart 1.4s ease-in-out infinite}
@keyframes heart{50%{transform:scale(1.2)}}
.petal{position:absolute;top:-12vh;font-size:var(--size);animation:fall var(--dur) linear forwards;filter:drop-shadow(0 4px 8px #38bdf844)}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}8%{opacity:.95}100%{transform:translate3d(var(--drift),115vh,0) rotate(var(--spin));opacity:.12}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fde68a;box-shadow:0 0 13px 4px #7dd3fc;animation:sparkle .9s ease-out forwards}
@keyframes sparkle{from{transform:scale(.2);opacity:1}to{transform:scale(2.5) translateY(-20px);opacity:0}}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:9;pointer-events:none;animation:confettiFall var(--dur) cubic-bezier(.1,.7,.2,1) forwards}
@keyframes confettiFall{to{transform:translate3d(var(--x),110vh,0) rotate(1000deg);opacity:.2}}
.toast{position:fixed;z-index:15;bottom:25px;left:50%;transform:translate(-50%,140%);padding:14px 20px;border:1px solid #7dd3fca0;border-radius:999px;background:#0f234af2;color:#f0f8ff;box-shadow:0 15px 40px #04091788;transition:transform .4s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.top-btn{position:fixed;z-index:4;right:18px;bottom:18px;width:45px;height:45px;border:1px solid #ffffff30;border-radius:50%;background:#11264ecc;color:#fff;font-size:1.1rem;backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s}
.top-btn.visible{opacity:1;pointer-events:auto}
@media(max-width:620px){nav{font-size:.67rem}.nav-tag{padding:7px 9px}.timeline{grid-template-columns:1fr}.moment{padding:17px 5px}.hero{padding-top:45px}.section{border-radius:24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div><div id="petals" aria-hidden="true"></div><div id="sparkles" aria-hidden="true"></div><div id="trail" aria-hidden="true"></div>
<main id="top">
