<script>
const wishes = [
  "Chúc bạn 19/11 luôn đẹp trai, học giỏi, thi môn nào qua môn đó với điểm số rực rỡ! 🏆",
  "Chúc chàng trai của lớp luôn tràn đầy năng lượng, tự tin chinh phục mọi ước mơ! 🚀",
  "19/11 vui vẻ nhé! Cảm ơn vì luôn nhiệt tình, ga-lăng và là mảnh ghép không thể thiếu của lớp. 💙",
  "Chúc bạn luôn giữ vững phong độ, ví tiền rủng rỉnh và niềm vui ngập tràn mỗi ngày! ✨",
  "Chúc bạn sức khỏe dồi dào, đá bóng hay, học bài giỏi và lúc nào cũng cười thật tươi! ⚽",
  "Nhân ngày Quốc tế Nam giới, chúc bạn luôn bản lĩnh, kiên trì và gặp thật nhiều may mắn! 🍀",
  "Chúc 'nam thần' lớp mình có một ngày 19/11 thật đáng nhớ, mọi dự định đều thành công! 🌟",
  "Chúc bạn chạy deadline không bao giờ trễ, kiểm tra trúng tủ và luôn giữ tinh thần lạc quan! 📚"
];

function pickWish() {
  document.getElementById("wishDisplay").textContent = wishes[Math.floor(Math.random() * wishes.length)];
  burstFX(80);
}
function openGift() {
  document.getElementById("giftModal").classList.add("open");
  burstFX(120);
}
function closeGift(e, force) {
  if (force || e.target.id === "giftModal") document.getElementById("giftModal").classList.remove("open");
}

const canvas = document.getElementById("fx"), ctx = canvas.getContext("2d");
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

function burstFX(n = 90) {
  const colors = ["#38bdf8", "#fbbf24", "#fde68a", "#60a5fa", "#f472b6", "#34d399"];
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -10 - Math.random() * 120,
      r: 5 + Math.random() * 6,
      c: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: 2.5 + Math.random() * 4.5,
      rot: Math.random() * 6.28
    });
  }
}
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.y < canvas.height + 30);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.rot += 0.08;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 0.7);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
loop(); setTimeout(() => burstFX(80), 300);

let audioCtx, timer, playing = false, step = 0;
const songs = [
  [261.63, 329.63, 392.00, 493.88, 523.25, 493.88, 392.00, 329.63],
  [220.00, 261.63, 329.63, 392.00, 349.23, 329.63, 293.66, 261.63],
  [293.66, 369.99, 440.00, 587.33, 554.37, 440.00, 369.99, 329.63]
];
function tone(f) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0.14, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.5);
}
function stopAll() {
  clearInterval(timer); timer = null;
  document.getElementById("customAudio").pause();
  playing = false; document.getElementById("musicBtn").textContent = "♫ Bật nhạc";
}
function toggleMusic() {
  const v = document.getElementById("songSelect").value, btn = document.getElementById("musicBtn"), mp3 = document.getElementById("customAudio");
  if (playing) return stopAll();
  if (v === "mp3") {
    mp3.play().then(() => { playing = true; btn.textContent = "❚❚ Tắt nhạc"; })
      .catch(() => alert("Chưa có file nhac.mp3 trong kho GitHub. Hãy chọn Giai điệu 1, 2 hoặc 3 nhé!"));
  } else {
    const arr = songs[Number(v)]; step = 0; tone(arr[0]);
    timer = setInterval(() => { step = (step + 1) % arr.length; tone(arr[step]); }, 480);
    playing = true; btn.textContent = "❚❚ Tắt nhạc";
  }
}
function changeTrack() { if (playing) { stopAll(); toggleMusic(); } }
</script>
</body>
</html>
